name: Pull Request Verification

# Controls when the workflow will run
on:
  pull_request:
    # Trigger only when targeting specific branches (e.g., main or master)
    branches: [ main, master ]
    # Explicitly define activity types (defaults to opened, synchronize, reopened)
    types: [ opened, synchronize, reopened, ready_for_review ]

# Automatically cancel older in-progress runs if a user pushes new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the code from the PR branch
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up your environment (Example uses Node.js, swap for Python, Go, etc.)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up subsequent workflow runs

      # Step 3: Install all required project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run a linter or formatter check
      - name: Run code linter
        run: npm run lint

      # Step 5: Run your automated test suite
      - name: Run unit tests
        run: npm test
